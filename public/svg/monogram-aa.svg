<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="30%" stop-color="#E5C16C" />
      <stop offset="60%" stop-color="#C09228" />
      <stop offset="90%" stop-color="#E5C16C" />
      <stop offset="100%" stop-color="#9C7216" />
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#543D28" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(150, 150)" filter="url(#mShadow)">
    <rect x="-125" y="-125" width="250" height="250" rx="4" fill="none" stroke="url(#goldM)" stroke-width="2.5" />
    <rect x="-125" y="-125" width="250" height="250" rx="4" fill="none" stroke="url(#goldM)" stroke-width="2.5" transform="rotate(45)" />

    <circle cx="0" cy="0" r="112" fill="none" stroke="url(#goldM)" stroke-width="1.5" stroke-dasharray="3, 4" />
    <circle cx="0" cy="0" r="102" fill="none" stroke="url(#goldM)" stroke-width="2" />

    <g fill="url(#goldM)" opacity="0.8">
      <circle cx="0" cy="-125" r="3" />
      <circle cx="0" cy="125" r="3" />
      <circle cx="-125" cy="0" r="3" />
      <circle cx="125" cy="0" r="3" />
      <circle cx="-88" cy="-88" r="3" />
      <circle cx="88" cy="-88" r="3" />
      <circle cx="-88" cy="88" r="3" />
      <circle cx="88" cy="88" r="3" />
    </g>

    <!-- Amatullah & Abbas Ali: A & A -->
    <text x="-26" y="24" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="74" font-weight="bold" fill="url(#goldM)" text-anchor="middle">
      A
    </text>
    <text x="0" y="8" font-family="'Playfair Display', serif" font-style="italic" font-size="34" fill="url(#goldM)" text-anchor="middle" opacity="0.95">
      &amp;
    </text>
    <text x="26" y="24" font-family="'Cinzel Decorative', 'Playfair Display', serif" font-size="74" font-weight="bold" fill="url(#goldM)" text-anchor="middle">
      A
    </text>

    <text x="0" y="66" font-family="'Amiri', serif" font-size="20" fill="url(#goldM)" text-anchor="middle" letter-spacing="1">
      أمة الله &amp; عباس علي
    </text>
  </g>
</svg>
